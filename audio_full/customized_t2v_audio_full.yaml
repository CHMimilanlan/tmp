# =============================================================================
# LTX-2 Audio-Branch Full Fine-Tuning Configuration
# =============================================================================
#
# This configuration does not load or create any LoRA adapter. The video branch
# remains frozen, the original audio-side parameters are fully trainable, and
# only the audio prediction contributes to the training loss.
#
# Required dataset structure:
#   preprocessed_data_root/
#   ├── latents/
#   ├── conditions/
#   └── audio_latents/
# =============================================================================

model:
  model_path: "/data/vjuicefs_ai_camera_jgroup_video/public_data/Video_Data/VideoAudioData/VideoAudioModels/LTX-2.3/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: "/data/vjuicefs_ai_camera_jgroup_video/public_data/Video_Data/VideoAudioData/VideoAudioModels/gemma-3-12b-it-qat-q4_0-unquantized"

  # Custom trainer mode: train original audio weights only.
  training_mode: "audio_full"

  # Explicitly disabled. trainer_audio_full.py never calls get_peft_model().
  frozen_lora_path: null

  # Optional audio_full checkpoint or directory for resume.
  load_checkpoint: null

# Kept only for compatibility with configurations that require a lora section.
# trainer_audio_full.py ignores these values and asserts that no LoRA modules exist.
lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules: []

training_strategy:
  name: "flexible"

  # Video still participates in the AV forward pass, but video targets are
  # removed before loss computation and all video parameters remain frozen.
  video:
    is_generated: true
    latents_dir: "latents"
    conditions: []

  audio:
    is_generated: true
    latents_dir: "audio_latents"
    conditions: []

optimization:
  learning_rate: 1e-4
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: false

data:
  preprocessed_data_root: "/data/vjuicefs_ai_camera_jgroup_video/public_data/Video_Data/VideoAudioData/SpatializeDataset_LTX/tmp_640x384/.precomputed"
  num_dataloader_workers: 4

validation:
  samples:
    - prompt: >-
        A locked-off medium-wide shot on a quiet pedestrian street in the late afternoon. A young
        man wearing a dark blue jacket walks smoothly and continuously from the left side of the frame
        to the right side at a steady pace. He remains at approximately the same distance from the
        camera and does not move closer or farther away. While walking, he looks slightly toward the
        camera and says clearly, “I’ll see you at the station.” The camera remains completely static
        throughout the single uncut shot: no pan, no tilt, no zoom, no dolly, and no reframing. Natural
        city ambience, light footsteps moving from left to right, and the man’s voice moving consistently with him.
      track: /data/vjuicefs_ai_camera_jgroup_video/public_data/Video_Data/VideoAudioData/SpatializeDataset_LTX/validation_samples/768x512/left_to_right_tracks.pt
      conditions: []

    - prompt: >-
        A locked-off medium-wide shot of a quiet suburban road on a bright sunny day. A small red
        delivery scooter rides smoothly and continuously from the right side of the frame to the
        left side at a steady speed. The scooter stays at approximately the same distance from the
        camera and remains fully visible throughout the shot. The camera remains completely static
        throughout the single uncut shot: no pan, no tilt, no zoom, no dolly, and no reframing.
        Ambient outdoor sounds, soft wind, distant birds, and the scooter engine sound moving
        naturally from right to left together with the scooter.
      track: /data/vjuicefs_ai_camera_jgroup_video/public_data/Video_Data/VideoAudioData/SpatializeDataset_LTX/validation_samples/640x384/right_to_left_tracks.pt
      conditions: []

  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"
  video_dims: [640, 384, 121]
  frame_rate: 24.0
  seed: 42
  inference_steps: 30
  interval: 100
  guidance_scale: 4.0
  stg_scale: 1.0
  stg_blocks: [29]
  stg_mode: "stg_av"
  generate_audio: true
  skip_initial_validation: false

checkpoints:
  interval: 250
  keep_last_n: -1
  precision: "bfloat16"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: true
  project: "LTX"
  entity: "1821698873"
  tags: ["ltx2", "audio-full", "no-lora"]
  log_validation_videos: true

seed: 42
output_dir: "outputs/t2v_audio_full_no_lora"
